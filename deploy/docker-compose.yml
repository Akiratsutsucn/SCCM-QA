# 单机部署：app（Next.js）+ db（PostgreSQL 16）+ caddy（HTTPS 反向代理，自签名证书）
# 对外只开 HTTPS_PORT（默认 14443）与 80（跳转）。数据库不对外。
name: w11-assist

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: w11
      POSTGRES_USER: w11
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?须在 .env 设置}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w11 -d w11"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
    image: w11-assist:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://w11:${POSTGRES_PASSWORD}@db:5432/w11
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:?须在 .env 设置}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?须在 .env 设置}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?须在 .env 设置}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-14443}
      PUBLIC_HOST: ${PUBLIC_HOST:?须在 .env 设置}
    ports:
      - "${HTTPS_PORT:-14443}:${HTTPS_PORT:-14443}"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    networks: [internal]

volumes:
  pgdata:
  media:
  caddy_data:

networks:
  internal:
